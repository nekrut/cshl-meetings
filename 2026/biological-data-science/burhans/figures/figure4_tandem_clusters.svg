<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" height="100%">
<style>
  text { font-family: "Atkinson Hyperlegible Next", "Helvetica Neue", Arial, sans-serif; fill: #18243a; }
  .mono { font-family: "Atkinson Hyperlegible Mono", "SFMono-Regular", Consolas, monospace; }
  .title { font-size: 13px; font-weight: 800; fill: #25324d; }
  .sub { font-size: 10px; fill: #4f5b70; }
  .lbl { font-size: 10px; font-weight: 600; fill: #18243a; }
  .ax { font-size: 9.4px; fill: #4f5b70; }
  .badge { font-size: 12px; font-weight: 800; fill: #ffffff; }
</style>
<rect x="0" y="0" width="900" height="215" rx="10" fill="#ffffff"/>
<rect x="12" y="10" width="22" height="22" rx="6" fill="#25324d"/>
<text x="23" y="25.5" text-anchor="middle" class="badge">A</text>
<text x="40" y="21.5" class="title">CBDAS (chr7:30.98 Mb) Across 216 Queries</text>
<text x="40" y="33.5" class="sub">79 ≥98.5%, 77 at 93.0–98.5% (63 B-locus annotated), 6 &lt;93%, 54 pruned</text>
<text x="24" y="54" class="lbl">Intact CBDAS (≥98.5% id, 56 full-len)</text>
<rect x="24" y="59" width="130.1" height="14" rx="3" fill="#009E73"/>
<text x="162.1" y="70" class="ax">79 (59 plants) — functional copy</text>
<text x="24" y="92" class="lbl">93.0–98.5% (~94% B-locus pseudogene)</text>
<rect x="24" y="97" width="126.8" height="14" rx="3" fill="#E69F00"/>
<text x="158.8" y="108" class="ax">77 (67 plants) — 63 annotated, 14 not</text>
<text x="24" y="130" class="lbl">Diverged aligned (&lt;93.0%, ≥50% CDS)</text>
<rect x="24" y="135" width="9.9" height="14" rx="3" fill="#56B4E9"/>
<text x="41.9" y="146" class="ax">6 queries (91.9–92.9% id)</text>
<text x="24" y="168" class="lbl">Unaligned in synNet (&lt;50% CDS)</text>
<rect x="24" y="173" width="88.9" height="14" rx="3" fill="#D55E00"/>
<text x="120.9" y="184" class="ax">54 pruned by -syn (Finola 99.4%)</text>
<line x1="468" y1="12" x2="468" y2="203" stroke="#d5dbe5"/>
<rect x="480" y="10" width="22" height="22" rx="6" fill="#25324d"/>
<text x="491" y="25.5" text-anchor="middle" class="badge">B</text>
<text x="508" y="21.5" class="title">netFilter -syn Pruning vs Paralog Reuse</text>
<text x="508" y="33.5" class="sub">46.4% of recovered pairs (569/1,225) overlap another family gene</text>
<text x="492" y="54" class="lbl">TPS family (41 genes: 31 in 9 clusters + 10)</text>
<rect x="492" y="59" width="13.6" height="14" rx="3" fill="#56B4E9"/>
<text x="513.6" y="70" class="ax mono">418/8,856 pruned (4.7%)</text>
<text x="492" y="92" class="lbl">BBE-like family (35 genes: 29 in 9 clusters + 6)</text>
<rect x="492" y="97" width="31.0" height="14" rx="3" fill="#0072B2"/>
<text x="531.0" y="108" class="ax mono">807/7,560 pruned (10.7%)</text>
<text x="492" y="130" class="lbl">Recovered pairs overlapping another family gene</text>
<rect x="492" y="135" width="134.6" height="14" rx="3" fill="#D55E00"/>
<text x="634.6" y="146" class="ax mono">569/1,225 (46.4%)</text>
</svg>